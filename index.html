<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Winnie Video Library</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1420;color:#f1f6fb;font:16px system-ui}header{padding:22px;background:#122536;border-bottom:1px solid #29475a}h1{font-size:23px;margin:0}main{max-width:1100px;margin:25px auto;padding:16px;display:grid;grid-template-columns:2fr 1fr;gap:20px}section,aside{background:#152434;border:1px solid #284359;border-radius:16px;padding:15px}video{width:100%;max-height:65vh;background:#050505;border-radius:10px}button{background:#183247;border:1px solid #477087;color:white;border-radius:9px;padding:12px;cursor:pointer;margin:4px}button.active{border-color:#57d4f0;background:#164653}small{display:block;color:#a6bed1;margin-top:5px}#items button{width:100%;text-align:left}@media(max-width:720px){main{display:block}aside{margin-top:20px}}</style><header><h1>▶ Winnie Video Library</h1><small>Смотрим ролики прямо в браузере</small></header><main><section><video id="v" controls playsinline preload="metadata"></video><h2 id="title">Загрузка…</h2><p id="sub"></p><button id="prev">← Назад</button><button id="next">Далее →</button><button onclick="v.playbackRate=.5">0,5×</button><button onclick="v.playbackRate=1">1×</button></section><aside><h2>Наши видео</h2><div id="items"></div><p id="status"></p></aside></main><script>const v=document.getElementById('v'),t=document.getElementById('title'),s=document.getElementById('sub'),items=document.getElementById('items'),status=document.getElementById('status');let movies=[],idx=0;function pick(n){idx=(n+movies.length)%movies.length;const m=movies[idx];v.pause();v.src=m.src;v.load();t.textContent=m.title;s.textContent=m.subtitle;Array.from(items.children).forEach((b,j)=>b.classList.toggle('active',j===idx))}fetch('library.json?'+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(data=>{movies=data;data.forEach((m,i)=>{const b=document.createElement('button');b.textContent=m.title+' · '+m.duration;b.onclick=()=>{pick(i);v.play().catch(()=>{})};items.append(b)});pick(0);status.textContent='Видео: '+movies.length}).catch(e=>{t.textContent='Каталог не загружен';status.textContent=e.message});document.getElementById('prev').onclick=()=>pick(idx-1);document.getElementById('next').onclick=()=>pick(idx+1);v.addEventListener('error',()=>status.textContent='Видео недоступно: проверьте папку videos/')</script></html>
