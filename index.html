<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Winnie Video Library</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1420;color:#f1f6fb;font:16px system-ui}header{padding:22px;background:#122536;border-bottom:1px solid #29475a}h1{font-size:23px;margin:0}main{max-width:1100px;margin:25px auto;padding:16px;display:grid;grid-template-columns:2fr 1fr;gap:20px}section,aside{background:#152434;border:1px solid #284359;border-radius:16px;padding:15px}video{width:100%;max-height:65vh;background:#050505;border-radius:10px}button{background:#183247;border:1px solid #477087;color:white;border-radius:9px;padding:12px;cursor:pointer;margin:4px}button.active{border-color:#57d4f0;background:#164653}small{display:block;color:#a6bed1;margin-top:5px}#items button{width:100%;text-align:left}@media(max-width:720px){main{display:block}aside{margin-top:20px}}</style><header><h1>▶ Winnie Video Library</h1><small>Смотрим ролики прямо в браузере</small></header><main><section><video id="v" controls playsinline preload="metadata"></video><h2 id="title">Загрузка…</h2><p id="sub"></p><button id="prev">← Назад</button><button id="next">Далее →</button><button onclick="v.playbackRate=.5">0,5×</button><button onclick="v.playbackRate=1">1×</button></section><aside><h2>Наши видео</h2><div id="items"></div><p id="status"></p></aside></main><script>const v=document.getElementById('v'),t=document.getElementById('title'),s=document.getElementById('sub'),items=document.getElementById('items'),status=document.getElementById('status');let movies=[],idx=0;function pick(n){idx=(n+movies.length)%movies.length;const m=movies[idx];v.pause();v.src=m.src;v.load();t.textContent=m.title;s.textContent=m.subtitle;Array.from(items.children).forEach((b,j)=>b.classList.toggle('active',j===idx))}const labels={'winnie-final-15s.mp4':['Винни — полная песня','15 секунд · все три сцены'],'winnie-10s.mp4':['Винни — первые две сцены','10 секунд · улучшенная версия'],'cat-original.mp4':['Кот — оригинал','15 секунд · оригинальное видео']};function show(data){movies=data;items.replaceChildren();data.forEach((m,i)=>{const b=document.createElement('button');b.textContent=m.title;b.onclick=()=>{pick(i);v.play().catch(()=>{})};items.append(b)});if(data.length)pick(0);else t.textContent='Видео пока нет';status.textContent='Видео: '+data.length}async function loadLibrary(){try{const r=await fetch('https://api.github.com/repos/antonkrovlja-tech/winnie-video-library/contents/videos?ref=main&v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('GitHub '+r.status);const files=await r.json();const data=files.filter(f=>f.type==='file'&&f.name.toLowerCase().endsWith('.mp4')).map(f=>({id:f.name,title:(labels[f.name]||[f.name])[0],subtitle:(labels[f.name]||['','Новое видео'])[1],src:'videos/'+encodeURIComponent(f.name)}));data.sort((x,y)=>{const priority=['winnie-final-15s.mp4','winnie-10s.mp4','cat-original.mp4'];const i=priority.indexOf(x.id),j=priority.indexOf(y.id);return (i<0?100:i)-(j<0?100:j)||x.id.localeCompare(y.id)});show(data)}catch(e){try{const r=await fetch('library.json?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('fallback');show(await r.json());status.textContent='Резервный каталог'}catch(_){status.textContent='Каталог недоступен';t.textContent='Ошибка загрузки'}}}loadLibrary();document.getElementById('prev').onclick=()=>pick(idx-1);document.getElementById('next').onclick=()=>pick(idx+1);v.addEventListener('error',()=>status.textContent='Видео недоступно: проверьте папку videos/')</script></html>
