name: Refresh video catalog
on:
  push:
    branches: [main]
    paths:
      - 'videos/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Generate catalog from MP4 files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          known = {
              'winnie-final-15s.mp4': ('Винни — полная песня', '15 секунд · все три сцены', '0:15'),
              'winnie-10s.mp4': ('Винни — первые две сцены', '10 секунд · улучшенная версия', '0:10'),
              'cat-original.mp4': ('Кот — оригинал', '15 секунд · оригинальное видео', '0:15')
          }
          paths = sorted(Path('videos').glob('*.mp4'))
          paths.sort(key=lambda p: (list(known).index(p.name) if p.name in known else 100, p.name))
          data=[]
          for p in paths:
              title, subtitle, duration = known.get(p.name, (p.stem.replace('-', ' ').replace('_', ' '), 'Новое видео', ''))
              data.append({'id': p.stem, 'title':title,'subtitle':subtitle,'duration':duration,'src':'videos/'+p.name})
          Path('library.json').write_text(json.dumps(data, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          PY
      - name: Commit catalog when changed
        run: |
          if ! git diff --quiet -- library.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add library.json
            git commit -m "Auto-refresh Winnie video catalog"
            git push
          fi
